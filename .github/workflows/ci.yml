name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One step per package: a recursive run can hide a package's failure behind another's success.
      - name: Typecheck contracts
        run: pnpm --filter @elfoqsy/contracts run typecheck
      - name: Typecheck state
        run: pnpm --filter @elfoqsy/state run typecheck
      - name: Typecheck daemon
        run: pnpm --filter @elfoqsy/daemon run typecheck
      - name: Typecheck web
        run: pnpm --filter @elfoqsy/web run typecheck
      - name: Test contracts
        run: pnpm --filter @elfoqsy/contracts run test
      - name: Test daemon
        run: pnpm --filter @elfoqsy/daemon run test
      - name: Test web
        run: pnpm --filter @elfoqsy/web run test
      - name: Build web
        run: pnpm --filter @elfoqsy/web run build
